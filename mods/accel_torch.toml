changelog = "代码整合，行为不变：897 行的单文件拆成 tier / settings / screen / torch / budget / spark / util 七个模块加 lib.rs，范围、速度档、面板和共享预算都与 0.1.5 一致，方便以后并入别的模组。实测面板写入 {sx:3, sy:3, sz:1, speed:200, active:1b}；reach 内的树苗约 60 tick 长成，把范围外的树苗放进 reach 后同样长成；最宽档 27（55x55x55）+ 640000% 连续两次 100 tick 都是 5.00 秒（20 TPS）。注册表条目只保留本版本。"
